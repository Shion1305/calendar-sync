name: Test and publish
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - run: go test -race ./...
      - run: go vet ./...
  image:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: calendar-sync-image-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref || github.run_id }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: Shion1305/k8s-GitOps/.github/actions/harbor-build-push@5f5f0e098b2b8753e27ca85e177e3ea4f9646072
        id: image
        with:
          image: harbor.shion1305.com/shion1305/calendar-sync
          # Branch images would displace releases under Harbor's keep-two policy.
          push: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Publish latest from the current default branch
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          head_sha=$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)
          if [[ "$GITHUB_SHA" == "$head_sha" ]]; then
            crane tag "$IMAGE_REF" latest
            test "$(crane digest "${IMAGE_REF%@*}:latest")" = "${IMAGE_REF#*@}"
          fi
      - if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: printf '%s\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
